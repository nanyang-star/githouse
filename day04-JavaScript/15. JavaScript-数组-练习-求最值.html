<body>
  <script>
    //求数组最大值
    let array = [1,5,58,56,98,5,3,4,7];
    let max = array[0];
    for (let i = 0; i < array.length; i++) {
      if(array[i] > max){
        max = array[i];
      }
    }
    console.log(max);
  </script>
