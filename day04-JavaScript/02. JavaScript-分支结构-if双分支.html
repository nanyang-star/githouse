<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body>
  <script>
    //只有用户名是刘德华且密码为123456时，才能显示登录成功，否则显示登录失败
    let username = prompt("请输入用户名");
    let password = prompt("请输入密码");
    if(username == "刘德华" && password == "123456"){
      alert("登录成功");
    }else{
      alert("登录失败");
    }
  </script>
</body>
</html>
