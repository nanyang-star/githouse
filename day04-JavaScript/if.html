<body>
  
  <script>
    //if成绩大于700，提示考入清华
    let score = prompt("请输入成绩");
    score = Number(score);
    if(score >= 700){
      alert("恭喜你考入清华");
    }
    alert("程序结束");
    
  </script>
</body>
