<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //比较运算符
    console.log(10>5);//T
    console.log(10>=10);//T
    console.log(10<5);//F
    console.log(10<=10);//T
    console.log(10=='10');//T
    console.log(10==='10');//F
    console.log(10!='10');//F
    console.log(10!=='10');//T
  </script>
</body>
</html>
