<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混合</title>
</head>

<body>
  <script>
    //从键盘得到用户的整数
    let num = prompt("请输入一个整数");
    let result = (num % 4 == 0) && (num % 100 != 0) ? "True" : "False";
    console.log(result);
    
  </script>
