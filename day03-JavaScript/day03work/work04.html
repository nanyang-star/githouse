<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>判断年份是否为闰年</title>
</head>

<body>
  <script>
    // 盘录入年份，判断是否是闰年。闰年规则：能被4整除但不能被100整除，或能被400整除的年份。输出结果格式：XXX年是闰年或者xXX年不是闰年
    let year = prompt("请输入年份");//定义变量year，用于存储用户输入的年份
    let isLeapYear = false;//定义变量isLeapYear，用于存储是否为闰年的结果
    isLeapYear = ((year % 4 == 0) && (year % 100 != 0)) || (year % 400 == 0);//判断是否为闰年
    // 输出结果
    document.writeln(isLeapYear ? `${year}年是闰年` : `${year}年不是闰年`);
  </script>
</body>

</html>
