<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四位数各数位求和</title>
</head>

<body>
  <script>
    // 需求：键盘录入一个四位数，计算这个四位数的个位、十位、百位、千位数字之和。
    let num = prompt("请输入一个四位数");
    let sum = 0;
    sum = num % 10 //个位数字
    sum += parseInt(num / 10) % 10;//十位数字
    sum += parseInt(num / 100) % 10;//百位数字
    sum += parseInt(num / 1000) % 10;//千位数字
    document.writeln(`该四位数的个位、十位、百位、千位数字之和为${sum}`);
  </script>
</body>

</html>
