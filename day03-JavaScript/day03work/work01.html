<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三元运算符 </title>
</head>

<body>
  <script>
    // 键盘录入一个整数，判断该数字是否是偶数且大于10。如果满足条件输出"符合要求"，否则输出"不符合要求"。
    let num = prompt("请输入一个整数");
    num = Number(num);
    //判断公式，并利用document.write()方法输出结果来打印
    num % 2 == 0 && num > 10 ? document.write(num, "符合要求") : document.write(num, "不符合要求")
  </script>
</body>

</html>
