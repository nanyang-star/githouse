<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <script>
    // 交换apple和orange变量中存储的值
    // 1. 定义两个变量apple和orange，分别存储苹果汁和橙子汁
    // 2. 定义一个临时变量temp，用于存储apple变量中的值
    // 3. 将orange变量中的值赋值给apple变量
    // 4. 将temp变量中的值赋值给orange变量
    // 5. 打印交换前和交换后的apple和orange变量中的值
    let apple = '苹果汁';
    let orange = '橙子汁';
    let temp;
    console.log("交换前","apple:",apple,"orange:",orange);
    temp = apple;
    apple = orange;
    orange = temp;
    console.log("交换后","apple:",apple,"orange:",orange);

    
  </script>
</body>
</html>
