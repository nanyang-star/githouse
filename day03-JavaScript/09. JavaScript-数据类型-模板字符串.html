<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据类型-模板字符串</title>
</head>
<body>
  <script>
    // 模版字符串
    let name = "阳";
    let age = 23;
    // 单引号用法
    console.log("我是"+name+"，我今年"+age+"岁");
    // 双引号用法
    console.log(`我是${name+"楠"}，我今年${age+1}岁`);
  </script>
</body>
</html>
