<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 逻辑运算符：将多个关系表达式(条件)连接到一起运算，最终得到一个boolean类型的结果
    //     &&：逻辑与，也叫并且，左右两边有一个是false结果就是false，都为true结果才是true。  一假则假
    //     ||：逻辑或，也叫或者，左右两边有一个是true结果就是true，都为false结果才是false。  一真则真
    //     !：逻辑非，也叫取反，true取反是false，false取反是true。 
    let a = 5;
    console.log(a>3&&a<8);//true(3,8)
    console.log(a>5&&a<10);//false(5,10)
    console.log(a>3||a<8);//true
    console.log(a>3||a>8);//true
    console.log(a<3||a>8);//false
    console.log(!(a>3&&a<8));//false
  </script>
</body>
</html>
