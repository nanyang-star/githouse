<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赋值运算符</title>
</head>
<body>
  <script>
    // 赋值运算符
    let a = 10;
    a = 20;
    console.log(a);
    // 简化赋值运算符
    a += 10;//a=20+10=30
    console.log(a);
    // 简化赋值运算符
    a -= 10;//a=30-10=20
    console.log(a); 
    // 简化赋值运算符
    a *= 2;//a=20*2=40
    console.log(a);
    // 简化赋值运算符
    a /= 2;//a=40/2=20
    console.log(a);
    // 简化赋值运算符
    a %= 2;//a=20%2=0
    console.log(a);
    //总体结果 20 30 40 20 0 
  </script>
</body>
</html>
