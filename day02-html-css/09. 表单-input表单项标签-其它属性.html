<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09. 表单-input表单项标签-其它属性</title>
</head>
<body>
<form action="./tlias智能学习辅助系统.html" method="get">
     账号<input type="text" id="username" name="username" placeholder="请输入账号"><br>
      密码 <input type="password" id="password" name="password" placeholder="请输入密码"><br>
     提交按钮 <input type="submit" value="提交"><br>   
     文件上传项 <input type="file"  name="file"><br>
     日期输入框 <input type="date"  name="date"> <br>
     邮箱输入框 <input type="email"  name="email" placeholder="请输入邮箱"><br>
      性别：男 <input type="radio"  name="gender" value="male">
     女 <input type="radio"  name="gender" value="female"><br>

      爱好：唱<input type="checkbox"  name="hobby" value="sing">
      跳<input type="checkbox"  name="hobby" value="dance">
      rap<input type="checkbox"  name="hobby" value="rap">
    篮球 <input type="checkbox"  name="hobby" value="basketball">
     


</body>
</html>
