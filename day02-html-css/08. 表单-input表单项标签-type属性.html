<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07. 表单-表单标签</title>
</head>
<body>
    <!-- input表单项标签-type属性的取值 -->
     <!-- 
input标签：定义不同类型的表单项
    type属性：定义input表单项的类型，常见属性值如下：
      text：普通文本输入框，输入的内容原模原样展示，默认值。
      password：密码框，输入的内容以点的形式呈现。
      radio：单选按钮，多选一。
      checkbox：复选框，可以多选。
      file：文件上传项，用来上传文件到服务器
      date/time/datetime-local：定义日期/时间/日期时间
      number：定义数字输入框
      email：定义邮件输入框
      hidden：隐藏域，用来提交不期望用户在页面看到的数据
      submit：提交按钮，点击之后提交表单数据
      reset：重置按钮，点击之后表单数据重置。
      button：普通按钮，点击之后没有任何反应，需要结合JavaScript才能做出点击效果。
-->
<form action="./tlias智能学习辅助系统.html" method="post">
     提交按钮 <input type="submit" value="提交"><br>
     重置按钮 <input type="reset" value="重置"><br>
     按钮 <input type="button" value="按钮"><br>    
     文件上传项 <input type="file" id="file" name="file"><br>
     日期输入框 <input type="date" id="date" name="date"> <br>
     时间输入框 <input type="time" id="time" name="time"><br>
     日期时间输入框 <input type="datetime-local" id="datetime-local" name="datetime-local"><br>
     数字输入框 <input type="number" id="number" name="number"><br>
     邮箱输入框 <input type="email" id="email" name="email"><br>
     隐藏域 <input type="hidden" id="hidden" name="hidden"><br>
     单选按钮 <input type="radio" id="radio" name="radio"><br>
     复选框 <input type="checkbox" id="checkbox" name="checkbox"><br>
     文本域 <textarea id="textarea" name="textarea" rows="4" cols="50"></textarea><br>
     文本 <input type="text" id="text" name="text"><br>
     密码 <input type="password" id="password" name="password"><br>


</body>
</html>
