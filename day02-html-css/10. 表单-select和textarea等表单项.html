<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10. 表单-select和textarea等表单项</title>
</head>
<body>
<form action="./tlias智能学习辅助系统.html" method="get">
     <label for="username">账号：</label><input type="text" id="username" name="username" placeholder="请输入账号"><br>
      <label>密码: <input type="password"  name="password" placeholder="请输入密码"></label><br>
     提交按钮 <input type="submit" value="提交"><br>   
     文件上传项 <input type="file"  name="file"><br>
     日期输入框 <input type="date"  name="date"> <br>
     邮箱输入框 <input type="email"  name="email" placeholder="请输入邮箱"><br>
      <label>性别：男 <input type="radio"  name="gender" value="male" checked>
     </label><label>女 <input type="radio"  name="gender" value="female"></label><br>

      爱好：唱<input type="checkbox"  name="hobby" value="sing">
      跳<input type="checkbox"  name="hobby" value="dance">
      rap<input type="checkbox"  name="hobby" value="rap">
    篮球 <input type="checkbox"  name="hobby" value="basketball">
     
    <!-- 下拉选择框修为 -->
    <label for="level">修为：</label>
    <select id="level" name="level">
      <option value="1">练气</option>
      <option value="2">筑基</option>
      <option value="3">结丹</option>
      <option value="4">元婴</option>
      <option value="5">化神</option>
    </select><br>
     <!-- 文本域框 -->
     <label for="textarea">个人介绍：</label>
     <textarea id="textarea" name="textarea" rows="8" cols="50"></textarea><br>


</body>
</html>
