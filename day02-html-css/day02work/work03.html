<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物网页</title>
  <style>
    body {
      background-color: #f5f5f5;
      margin: 0;
    }

    /* 全局容器：宽度 1200px 居中 */
    .container {
      width: 1200px;
      margin: 0 auto;
    }

    /* 顶部标题栏 */
    .header {
      margin: 40px 0 20px;
      padding: 20px 0;
      /* 使用 flex 让左侧文本与右侧链接分列两端 */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 左侧：标题 + 副标题（同一行） */
    .header-left {
      display: flex;
      align-items: baseline;
    }

    .header-left .title {
      font-size: 28px;
      font-weight: normal;
      color: #333;
      margin: 0;
    }

    .header-left .subtitle {
      font-size: 14px;
      color: #999;
      margin-left: 20px;
    }

    /* 右侧：查看全部链接 */
    .header-right a {
      font-size: 14px;
      color: #999;
      text-decoration: none;
    }

    /* 鼠标移入链接时显示下划线 */
    .header-right a:hover {
      text-decoration: underline;
    }

    /* 第二部分：商品栏 */
    /* 1 行 4 列的网格布局 */
    .goods-list {
      margin: 0 0 80px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* 单个商品卡片 */
    .goods-item {
      background-color: #f0f9f4;
      overflow: hidden;
    }

    /* 图片容器：固定高度，让所有图片区域一致 */
    .goods-img {
      width: 100%;
      height: 270px;
    }

    /* 商品图片：铺满容器，保持比例裁剪，不拉伸变形 */
    .goods-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 文字区域 */
    .goods-info {
      padding: 16px 20px 20px;
      text-align: center;
    }

    /* 商品名：深色，单行显示，超过宽度显示省略号 */
    .goods-name {
      color: #333;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 价格：红色 */
    .goods-price {
      margin-top: 10px;
      color: #e1251b;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 第一部分：顶部标题栏 -->
    <div class="header">
      <div class="header-left">
        <div class="title">新鲜好物</div>
        <div class="subtitle">新鲜出炉 品质靠谱</div>
      </div>
      <div class="header-right">
        <a href="#">查看全部 &gt;</a>
      </div>
    </div>

    <!-- 第二部分：商品栏（1 行 4 列） -->
    <div class="goods-list">
      <div class="goods-item">
        <div class="goods-img"><img src="images/新鲜好物1.png" alt="商品1"></div>
        <div class="goods-info">
          <div class="goods-name">全防水HABU旋钮牛皮...</div>
          <div class="goods-price">￥444.00</div>
        </div>
      </div>
      <div class="goods-item">
        <div class="goods-img"><img src="images/新鲜好物2.png" alt="商品2"></div>
        <div class="goods-info">
          <div class="goods-name">儿童多色圆领印花短袖...</div>
          <div class="goods-price">￥59.00</div>
        </div>
      </div>
      <div class="goods-item">
        <div class="goods-img"><img src="images/新鲜好物3.png" alt="商品3"></div>
        <div class="goods-info">
          <div class="goods-name">古法温酒汝瓷酒具套装...</div>
          <div class="goods-price">￥488.00</div>
        </div>
      </div>
      <div class="goods-item">
        <div class="goods-img"><img src="images/新鲜好物4.png" alt="商品4"></div>
        <div class="goods-info">
          <div class="goods-name">2021年春季新品，儿童...</div>
          <div class="goods-price">￥59.00</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
