<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单制作</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    /* 表单容器 */
    .form-wrapper {
      width: 480px;
      margin: 0 auto;
      padding: 20px 10px;
    }

    /* 每一行表单项 */
    .form-item {
      margin-bottom: 22px;
      display: flex;
      align-items: center;
    }

    /* 标签 */
    .form-item > label {
      width: 60px;
      text-align: right;
      color: #666;
      margin-right: 16px;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* 输入框、下拉框统一样式 */
    .form-item input[type="text"],
    .form-item select {
      flex: 1;
      height: 40px;
      padding: 0 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      background-color: #fff;
      color: #333;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .form-item input[type="text"]::placeholder {
      color: #bbb;
    }

    .form-item input[type="text"]:focus,
    .form-item select:focus {
      border-color: #00c2a8;
    }

    /* 下拉框箭头 */
    .select-wrap {
      flex: 1;
      position: relative;
    }

    .select-wrap select {
      width: 100%;
      padding-right: 36px;
    }

    .select-wrap::after {
      content: '';
      position: absolute;
      right: 14px;
      top: 50%;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #999;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* 单选按钮组 */
    .radio-group {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .radio-group input[type="radio"] {
      margin: 0;
      cursor: pointer;
      accent-color: #00c2a8;
    }

    .radio-group label {
      margin: 0 24px 0 6px;
      color: #555;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    /* 文本域 */
    .textarea-wrap {
      flex: 1;
      position: relative;
    }

    .form-item textarea {
      width: 100%;
      height: 90px;
      padding: 10px 14px 24px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
      font-family: inherit;
      color: #333;
      background-color: #fff;
    }

    .form-item textarea::placeholder {
      color: #bbb;
    }

    .form-item textarea:focus {
      border-color: #00c2a8;
    }

    .char-count {
      position: absolute;
      right: 12px;
      bottom: 8px;
      font-size: 12px;
      color: #bbb;
    }

    /* 按钮区域 */
    .form-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      padding-left: 76px;
    }

    .btn {
      padding: 10px 36px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-reset {
      background-color: #fff;
      color: #666;
      border: 1px solid #ddd;
    }

    .btn-reset:hover {
      background-color: #f5f5f5;
    }

    .btn-submit {
      background-color: #00c2a8;
      color: #fff;
    }

    .btn-submit:hover {
      background-color: #00a890;
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <form action="#" method="post">
      <!-- 姓名 -->
      <div class="form-item">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" placeholder="请输入客户姓名">
      </div>

      <!-- 手机 -->
      <div class="form-item">
        <label for="phone">手机</label>
        <input type="text" id="phone" name="phone" placeholder="请输入手机号">
      </div>

      <!-- 性别 -->
      <div class="form-item">
        <label>性别</label>
        <div class="radio-group">
          <input type="radio" id="male" name="gender" value="男">
          <label for="male">男</label>
          <input type="radio" id="female" name="gender" value="女">
          <label for="female">女</label>
          <input type="radio" id="unknown" name="gender" value="未知">
          <label for="unknown">未知</label>
        </div>
      </div>

      <!-- 年龄 -->
      <div class="form-item">
        <label for="age">年龄</label>
        <input type="text" id="age" name="age" placeholder="请输入客户年龄">
      </div>

      <!-- QQ -->
      <div class="form-item">
        <label for="qq">QQ</label>
        <input type="text" id="qq" name="qq" placeholder="请输入qq">
      </div>

      <!-- 学科 -->
      <div class="form-item">
        <label for="subject">学科</label>
        <div class="select-wrap">
          <select id="subject" name="subject">
            <option value="" disabled selected hidden>请选择意向学科</option>
            <option value="ai应用">AI智能应用</option>
            <option value="ai大模型">AI大模型</option>
            <option value="ai运维">AI运维</option>
            <option value="ai测试">AI测试</option>
            <option value="大数据">大数据</option>
          </select>
        </div>
      </div>

      <!-- 渠道 -->
      <div class="form-item">
        <label for="channel">渠道</label>
        <div class="select-wrap">
          <select id="channel" name="channel">
            <option value="" disabled selected hidden>请选择渠道来源</option>
            <option value="线上活动">线上活动</option>
            <option value="推广介绍">推广介绍</option>
          </select>
        </div>
      </div>

      <!-- 备注 -->
      <div class="form-item">
        <label for="remark">备注</label>
        <div class="textarea-wrap">
          <textarea id="remark" name="remark" placeholder="请输入备注" maxlength="20"></textarea>
          <span class="char-count">0/20</span>
        </div>
      </div>

      <!-- 按钮区域 -->
      <div class="form-actions">
        <button type="reset" class="btn btn-reset">重置</button>
        <button type="submit" class="btn btn-submit">提交</button>
      </div>
    </form>
  </div>
</body>
</html>
