<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡片制作</title>
  <style>
    body {
      background-color: #f5f5f5;
    }

    .card {
      width: 220px;
      padding: 24px;
      background-color: #fff;
      border-radius: 12px;
      text-align: center;
      margin: 40px auto;
    }

    /* 方形圆角白底图片容器 */
    .card-img {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      background-color: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    .card-title {
      margin-top: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      transition: transform 0.3s ease;
    }

    .card-desc {
      margin-top: 8px;
      font-size: 14px;
      color: #999;
      transition: transform 0.3s ease;
    }

    /* 鼠标移入卡片时，图片和文字一起放大 */
    .card:hover .card-img,
    .card:hover .card-title,
    .card:hover .card-desc {
      transform: scale(1.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 点击图片跳转至抖音网页版 -->
    <a href="https://www.douyin.com" target="_blank">
      <div class="card-img">
        <img src="work2img/2cc85164-3f69-485e-b7b6-4e316e83fbe9.png" alt="抖音直播SDK">
      </div>
    </a>
    <div class="card-title">抖音直播SDK</div>
    <div class="card-desc">包含抖音直播看播功能</div>
  </div>
</body>
</html>
