<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业3</title>
</head>

<body>
  <!-- 页面标题，使用内联样式设置字体大小和居中 -->
  <div style="font-size: 30px; text-align: center;" id="tb1">课程表</div>

  <!--
        学员成绩表格：
        - width="800px"：设置表格宽度
        - border="1"：显示边框
        - cellspacing="0"：单元格之间无间距
        - align="center"：表格整体水平居中
    -->
  <table width="800px" border="1" cellspacing="0" align="center">
    <!-- 表头行：使用 th 标签，默认加粗居中 -->
    <tr>
      <th>学号</th>
      <th>姓名</th>
      <th>分数</th>
      <th>评语</th>
    </tr>
    <!-- 数据行：class="data" 用于在 JavaScript 中统一获取所有数据行 -->
    <tr align="center" class="data">
      <td>001</td>
      <td>张三</td>
      <td>90</td>
      <td>很优秀</td>
    </tr>
    <tr align="center" class="data">
      <td>002</td>
      <td>李四</td>
      <td>92</td>
      <td>优秀</td>
    </tr>
    <tr align="center" class="data">
      <td>003</td>
      <td>王五</td>
      <td>83</td>
      <td>很努力,不错</td>
    </tr>
    <tr align="center" class="data">
      <td>004</td>
      <td>赵六</td>
      <td>98</td>
      <td>666</td>
    </tr>
  </table>

  <br>

  <!-- 按钮区域：三个按钮分别对应三个交互功能 -->
  <div style="text-align: center;">
    <input id="b1" type="button" value="改变标题内容">
    <input id="b2" type="button" value="改变标题颜色">
    <input id="b3" type="button" value="删除最后一行">
  </div>
</body>

<script>
  /*
   * 功能1：点击 "改变标题内容" 按钮，将 div 中标题内容替换为 "学员成绩表"
   * 实现思路：
   *   1. 通过 document.querySelector('#b1') 获取 id 为 b1 的按钮对象
   *   2. 调用 addEventListener('click', ...) 为该按钮绑定点击事件
   *   3. 在事件处理函数中，通过 querySelector('#tb1') 获取标题 div
   *   4. 修改其 innerHTML 属性，页面会立即重新渲染显示新内容
   */
  let b1 = document.querySelector('#b1');
  b1.addEventListener('click', function () {
    document.querySelector('#tb1').innerHTML = '学员成绩表';
  });

  /*
   * 功能2：点击 "改变标题颜色" 按钮，将标题文字变为红色
   * 实现思路：
   *   1. 获取 id 为 b2 的按钮对象
   *   2. 绑定点击事件
   *   3. 通过 style.color 直接操作元素的内联样式
   *   注意：通过 style 属性设置的样式优先级较高，会覆盖同名的内联样式，
   *         但不会影响未设置的其他样式（如 font-size、text-align 保持不变）
   */
  let b2 = document.querySelector('#b2');
  b2.addEventListener('click', function () {
    document.querySelector('#tb1').style.color = 'red';
  });

  /*
   * 功能3：点击 "删除最后一行" 按钮，删除表格中最后一行数据
   * 实现思路：
   *   1. 获取 id 为 b3 的按钮对象
   *   2. 绑定点击事件
   *   3. 使用 document.querySelectorAll('tr.data') 获取所有 class 为 data 的数据行
   *      - querySelectorAll 返回的是一个 NodeList（伪数组），可以通过索引访问
   *   4. 取最后一个元素：dataRows[dataRows.length - 1]
   *   5. 调用 DOM 元素的 remove() 方法，将其从页面中移除
   *   6. 增加 length > 0 的判断，避免表格已无数据时出错
   */
  let b3 = document.querySelector('#b3');
  b3.addEventListener('click', function () {
    // 获取所有 class 为 data 的表格行
    let dataRows = document.querySelectorAll('tr.data');
    // 判断至少还有一行数据，防止删除空集合时报错
    if (dataRows.length > 0) {
      // 删除最后一行（数组最后一个元素）
      dataRows[dataRows.length - 1].remove();
    }
  });
</script>

</html>
