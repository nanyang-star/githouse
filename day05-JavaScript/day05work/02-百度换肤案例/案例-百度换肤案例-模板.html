<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Title</title>
  <!-- 讲解视频链接：https://www.bilibili.com/video/BV1mS4y1j7YZ?p=21 -->
  <style>
    /* 清除所有元素的默认内外边距，保持页面整洁 */
    * {
      margin: 0px;
      padding: 0px;
    }

    /*
     * body 默认背景图：
     * - background-image 用于设置背景图片
     * - 后面通过 JavaScript 动态修改该属性实现换肤效果
     */
    body {
      background-image: url(./images/bg1.jpg);
    }

    /*
     * 顶部图片选择栏：
     * - 半透明白色背景，使其在不同壁纸上都能看清
     * - 高度 200px，内容水平居中
     */
    #mask {
      background-color: rgba(255, 255, 255, 0.3);
      height: 200px;
      text-align: center;
    }

    /*
     * 选择栏中的缩略图：
     * - width: 200px 控制每张缩略图宽度
     * - margin-top: 35px 让图片垂直居中显示
     * - cursor: pointer 让鼠标悬停时显示手型，提示可点击
     */
    #mask img {
      width: 200px;
      margin-top: 35px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!--
    顶部换肤栏：
    - 包含 5 张缩略图，每张 img 的 src 对应一张壁纸
    - 点击图片后，JavaScript 会将该图片的 src 设置为 body 的背景图
  -->
  <div id="mask">
    <img src="./images/bg1.jpg" alt="" />
    <img src="./images/bg2.jpg" alt="" />
    <img src="./images/bg3.jpg" alt="" />
    <img src="./images/bg4.jpg" alt="" />
    <img src="./images/bg5.jpg" alt="" />
  </div>

  <script>
    /*
     * 百度换肤案例核心思路：
     * 1. 找到 #mask 中的所有 img 标签（缩略图）
     * 2. 为每个 img 绑定点击事件
     * 3. 点击某张缩略图时，将它的 src 属性值设置给 body 的 backgroundImage 样式
     * 4. 页面背景会立即切换为对应的图片
     */

    // 获取所有缩略图 img 标签对象，返回 NodeList（伪数组）
    const imgs = document.querySelectorAll('img');
    // 获取 body 标签对象，后续需要修改它的背景图样式
    const body = document.body;

    /*
     * 遍历每个 img 标签，为其绑定点击事件：
     * - forEach 是数组/NodeList 提供的遍历方法
     * - 参数 img 代表当前正在遍历的某一张缩略图对象
     */
    imgs.forEach(img => {
      img.addEventListener('click', () => {
        /*
         * 点击后，将当前被点击图片的 src 设置给 body 的 backgroundImage：
         * - body.style.backgroundImage 需要接收 CSS 函数形式的值：url("图片路径")
         * - 使用模板字符串 `url(${img.src})` 可以方便地把变量嵌入到字符串中
         * - img.src 会返回图片的完整路径（绝对路径）
         */
        body.style.backgroundImage = `url(${img.src})`;
      });
    });
  </script>
</body>

</html>
