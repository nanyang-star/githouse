<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .center {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="center">
        您好, 支付完成, <span id="time">5</span>秒之后将自动跳转至 <a href="https://www.itheima.com">黑马官网</a> 首页 ~
    </div>

    <script>
        //需求: 5秒倒计时(5-4-3-2-1)完毕后, 跳转到黑马官网首页
       let time = 5;
       setInterval(() => {
        time--;
        //在页面上显示倒计时时间
        document.querySelector('#time').innerHTML = time;
        //当time为0时，跳转至黑马官网
        if (time == 0) {
        location.href = 'https://www.itheima.com';
       }
       }, 1000);
    </script>
</body>

</html>
