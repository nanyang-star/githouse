<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对象-属性-值</title>
</head>
<body>
  <script>
    //创建对象
    let person = {
      name:'阳楠',
      age:23,
      sex:'男',
      graduation:'计算机',
      university:'武汉理工大学'
    }
    //打印对象
    console.log(person);
    //打印对象的属性
    console.log(`姓名：${person.name} 年龄：${person.age} 性别：${person.sex} 毕业专业：${person.graduation} 学校：${person.university}`);
    //给对象赋值
    person.age = 24;
    console.log(person);
  </script>
</body>
</html>
